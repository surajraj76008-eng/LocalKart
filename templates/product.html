{% extends "base.html" %}{% block content %}<div class="product-view"><img src="{{p.image}}" alt="{{p.name}}"><div><p class="eyebrow">{{p.category}}</p><h1>{{p.name}}</h1><p class="muted">{{p.description}}</p><h2>₹{{'%.2f'|format(p.price)}}</h2><p>★ 4.8 · Local seller: {{p.shop or 'LocalKart'}}</p><p>{{p.stock}} in stock</p><form action="/cart/add/{{p.id}}" method="post"><button class="btn">Add to cart</button></form></div></div>{% endblock %}
